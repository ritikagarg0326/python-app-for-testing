name: Deploy Todo App to EKS

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy with Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure EKS IAM Access
        run: |
          CLUSTER=todo-eks
          REGION=us-east-1
          ARN=$(aws sts get-caller-identity --query Arn --output text)

          echo "GitHub IAM identity: $ARN"

          if ! aws eks describe-access-entry \
            --cluster-name "$CLUSTER" \
            --principal-arn "$ARN" \
            --region "$REGION" >/dev/null 2>&1; then

            aws eks create-access-entry \
              --cluster-name "$CLUSTER" \
              --principal-arn "$ARN" \
              --type STANDARD \
              --region "$REGION"
          fi

          aws eks associate-access-policy \
            --cluster-name "$CLUSTER" \
            --principal-arn "$ARN" \
            --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
            --access-scope type=cluster \
            --region "$REGION" || true

      - name: Configure Kubernetes
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name todo-eks

          kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm Chart
        run: |
          helm lint ./todo-helm

      - name: Verify ECR Image
        run: |
          aws ecr describe-images \
            --repository-name dev/todo \
            --image-ids imageTag=${GITHUB_SHA} \
            --region us-east-1

      - name: Deploy Todo Application
        run: |
          helm upgrade --install todo-helm ./todo-helm \
            --namespace todo \
            --create-namespace \
            --set image.repository=470024785854.dkr.ecr.us-east-1.amazonaws.com/dev/todo \
            --set image.tag=${GITHUB_SHA} \
            --wait \
            --timeout 10m

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/todo-app \
            --namespace todo \
            --timeout=300s

          echo "Deployment successful!"

          kubectl get deployments -n todo
          kubectl get pods -n todo -o wide
          kubectl get services -n todo
          kubectl get svc -n todo -w
          kubectl get pods -n todo -o wide

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## Todo App Deployment Successful"
            echo ""
            echo "Image: ${GITHUB_SHA}"
            echo ""
            echo "### Kubernetes Resources"
            echo '```text'
            kubectl get deployments,pods,services -n todo
            echo '```'
            echo ""
            echo "### Access Application Locally"
            echo '```powershell'
            echo "aws eks update-kubeconfig --region us-east-1 --name todo-eks"
            echo "kubectl port-forward svc/todo-app 8080:80 -n todo"
            echo '```'
            echo ""
            echo "Open http://localhost:8080"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show Diagnostics on Failure
        if: failure()
        run: |
          echo "Deployment diagnostics"
          kubectl get pods -n todo -o wide || true
          kubectl get deployments -n todo || true
          kubectl get events -n todo \
            --sort-by=.metadata.creationTimestamp || true
