
name: Todo App CI/CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build and Push Docker Image
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  deploy:
    name: Deploy to AWS EKS
    needs: build
    uses: ./.github/workflows/cd.yaml
    secrets: inherit
