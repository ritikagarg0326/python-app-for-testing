<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px 16px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, .08);
        }
        h1 { margin: 0 0 8px; color: #2563eb; text-align: center; }
        .subtitle { margin: 0 0 24px; text-align: center; color: #64748b; }
        .add-form { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; min-width: 0; padding: 12px;
            border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;
        }
        button {
            border: 0; border-radius: 8px; padding: 10px 14px;
            cursor: pointer; font-weight: 600;
        }
        .add-button { background: #2563eb; color: white; }
        ul { list-style: none; padding: 0; margin: 22px 0 0; }
        li {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 13px 0; border-bottom: 1px solid #e2e8f0;
        }
        .task-title { overflow-wrap: anywhere; }
        .completed { color: #94a3b8; text-decoration: line-through; }
        .actions { display: flex; gap: 7px; flex-shrink: 0; }
        .complete-button { background: #dcfce7; color: #166534; }
        .delete-button { background: #fee2e2; color: #991b1b; }
        .empty { justify-content: center; color: #64748b; }
        @media (max-width: 420px) {
            .container { padding: 20px; }
            .add-form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>My To-Do App</h1>
        <p class="subtitle">Keep track of what you need to get done.</p>

        <form class="add-form" action="{{ url_for('add_task') }}" method="POST">
            <input type="text" name="title" placeholder="Enter a task..." maxlength="200" required>
            <button class="add-button" type="submit">Add task</button>
        </form>

        <ul>
            {% for task in tasks %}
            <li>
                <span class="task-title {{ 'completed' if task['completed'] else '' }}">
                    {{ task['title'] }}
                </span>
                <div class="actions">
                    <form action="{{ url_for('complete_task', task_id=task['id']) }}" method="POST">
                        <button class="complete-button" type="submit">
                            {{ 'Undo' if task['completed'] else 'Done' }}
                        </button>
                    </form>
                    <form action="{{ url_for('delete_task', task_id=task['id']) }}" method="POST">
                        <button class="delete-button" type="submit">Delete</button>
                    </form>
                </div>
            </li>
            {% else %}
            <li class="empty">No tasks yet. Add your first task above!</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
